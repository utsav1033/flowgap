[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgap"
version = "0.1.0"
description = "Find the caller intents your voice agent's flow doesn't handle, and draft nodes to close them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "google-generativeai>=0.8.0",
    "umap-learn>=0.5.6",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "sentence-transformers>=2.7.0",
    "hdbscan>=0.8.33",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]

[project.scripts]
flowgap = "flowgap.cli:main"

[tool.setuptools]
packages = ["flowgap", "analyzer", "eval", "api"]

[tool.setuptools.package-data]
flowgap = ["templates/*.yaml"]
